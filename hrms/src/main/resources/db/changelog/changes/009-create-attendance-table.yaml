databaseChangeLog:
  - changeSet:
      id: 009-create-attendance-table
      author: hrms-backend
      changes:
        - createTable:
            tableName: attendance
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_attendance_employee
                    references: employee(id)
              - column:
                  name: attendance_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: check_in_time
                  type: TIMESTAMP
              - column:
                  name: check_out_time
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addUniqueConstraint:
            tableName: attendance
            columnNames: employee_id, attendance_date
            constraintName: uq_attendance_employee_date