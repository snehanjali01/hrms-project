spring.application.name=hrms

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/hrms_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT: the secret MUST come from the JWT_SECRET environment variable (at least 32 characters)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Demo data: set APP_SEED_DEMO_DATA=true to create demo users (admin, hr, manager, employee) on an empty database
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}

# CORS: comma-separated browser origins allowed to call the API (the Vite dev server by default)
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}
